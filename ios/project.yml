name: EtherPlayer
options:
  bundleIdPrefix: com.ethertech
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
targets:
  EtherPlayer:
    type: application
    platform: iOS
    sources:
      - path: EtherPlayer
    preBuildScripts:
      - name: Generate EtherPlayer app icons
        script: |
          /bin/bash "$SRCROOT/tools/make_icons.sh"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ethertech.etherplayer
        PRODUCT_NAME: EtherPlayer
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_FILE: EtherPlayer/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets: []
