name: EtherPlayer Windows EXE

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build
      - name: Build EtherPlayer
        run: cmake --build build --config Release --target EtherPlayer
      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/ETHERPLAYERv1.0.exe dist/ETHERPLAYERv1.0.exe
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: ETHERPLAYERv1.0-WINDOWS-x64
          path: dist/ETHERPLAYERv1.0.exe
          if-no-files-found: error
