name: Build Agnathos Vox

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build single EXE
        shell: cmd
        run: >
          cl /nologo /std:c++20 /O2 /EHsc /DUNICODE /D_UNICODE /DWIN32_LEAN_AND_MEAN
          /Fe:AGNATHOS_VOX.exe
          experimental\agnathos_vox\AgnathosVox.cpp
          user32.lib gdi32.lib winmm.lib
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: AGNATHOS_VOX
          path: AGNATHOS_VOX.exe
          if-no-files-found: error
